services:
  postgres:
    image: postgres:16-alpine
    container_name: iptvlinux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iptvlinux
      POSTGRES_PASSWORD: iptvlinux
      POSTGRES_DB: iptvlinux
    ports:
      - "5432:5432"
    volumes:
      - iptvlinux_postgres_data:/var/lib/postgresql/data

volumes:
  iptvlinux_postgres_data:
