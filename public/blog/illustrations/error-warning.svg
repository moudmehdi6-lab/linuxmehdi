<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="IPTV error codes illustration showing a screen displaying a warning alert">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0B0B"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- screen frame -->
  <rect x="330" y="160" width="540" height="300" rx="14" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-opacity="0.6"/>
  <rect x="560" y="460" width="80" height="16" rx="4" fill="#ffffff" fill-opacity="0.12"/>
  <rect x="490" y="476" width="220" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
  <!-- warning triangle -->
  <path d="M600 220 L690 380 L510 380 Z" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linejoin="round"/>
  <line x1="600" y1="270" x2="600" y2="325" stroke="#D4AF37" stroke-width="4" stroke-linecap="round"/>
  <circle cx="600" cy="352" r="4" fill="#D4AF37"/>
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" fill-opacity="0.5">Understanding IPTV error codes and alerts</text>
</svg>
