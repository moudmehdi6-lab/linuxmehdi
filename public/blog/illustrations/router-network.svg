<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Home network router optimization illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0B0B"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- router body -->
  <rect x="520" y="380" width="160" height="50" rx="10" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-opacity="0.85"/>
  <line x1="545" y1="380" x2="535" y2="340" stroke="#D4AF37" stroke-width="2.5" stroke-opacity="0.7"/>
  <line x1="655" y1="380" x2="665" y2="340" stroke="#D4AF37" stroke-width="2.5" stroke-opacity="0.7"/>
  <circle cx="600" cy="405" r="4" fill="#2563EB" fill-opacity="0.9"/>
  <!-- wifi arcs -->
  <path d="M540 360 A 70 70 0 0 1 660 360" fill="none" stroke="#2563EB" stroke-width="3" stroke-opacity="0.5"/>
  <path d="M510 330 A 110 110 0 0 1 690 330" fill="none" stroke="#2563EB" stroke-width="3" stroke-opacity="0.35"/>
  <path d="M480 300 A 150 150 0 0 1 720 300" fill="none" stroke="#2563EB" stroke-width="3" stroke-opacity="0.2"/>
  <!-- connected devices -->
  <circle cx="330" cy="480" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="870" cy="480" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="356" y1="470" x2="520" y2="415" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="4 6"/>
  <line x1="844" y1="470" x2="680" y2="415" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="600" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" fill-opacity="0.5">Optimizing your home network</text>
</svg>
