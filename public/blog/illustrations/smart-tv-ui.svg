<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Smart TV streaming app interface illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0B0B"/>
      <stop offset="100%" stop-color="#151515"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="674" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- TV frame -->
  <rect x="330" y="150" width="540" height="320" rx="16" fill="none" stroke="#D4AF37" stroke-width="3" stroke-opacity="0.85"/>
  <rect x="580" y="480" width="40" height="18" rx="4" fill="#ffffff" fill-opacity="0.15"/>
  <rect x="500" y="498" width="200" height="10" rx="5" fill="#ffffff" fill-opacity="0.1"/>
  <!-- app grid -->
  <g fill="none" stroke="#2563EB" stroke-width="2" stroke-opacity="0.7">
    <rect x="366" y="186" width="90" height="70" rx="10"/>
    <rect x="472" y="186" width="90" height="70" rx="10"/>
    <rect x="578" y="186" width="90" height="70" rx="10"/>
    <rect x="684" y="186" width="90" height="70" rx="10"/>
    <rect x="366" y="272" width="90" height="70" rx="10"/>
    <rect x="472" y="272" width="90" height="70" rx="10"/>
    <rect x="578" y="272" width="90" height="70" rx="10"/>
    <rect x="684" y="272" width="90" height="70" rx="10"/>
  </g>
  <rect x="578" y="272" width="90" height="70" rx="10" fill="#D4AF37" fill-opacity="0.2" stroke="#D4AF37" stroke-opacity="0.9"/>
  <text x="600" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" fill-opacity="0.5">Navigating a Smart TV app grid</text>
</svg>
